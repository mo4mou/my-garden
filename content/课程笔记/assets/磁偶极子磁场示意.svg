<svg width="420" height="420" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="420" height="420" fill="#fafafa" rx="8"/>

  <!-- Coordinate axes -->
  <defs>
    <marker id="arrowBlack" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#333"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#d32f2f"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#e65100"/>
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
      <polygon points="0,0 8,4 0,8" fill="#2e7d32"/>
    </marker>
  </defs>

  <!-- z-axis -->
  <line x1="210" y1="380" x2="210" y2="40" stroke="#333" stroke-width="2" marker-end="url(#arrowBlack)"/>
  <text x="215" y="35" font-size="15" fill="#333" font-weight="bold">z</text>

  <!-- x-axis (perspective) -->
  <line x1="30" y1="330" x2="280" y2="330" stroke="#333" stroke-width="2" marker-end="url(#arrowBlack)"/>
  <text x="285" y="335" font-size="15" fill="#333" font-weight="bold">x</text>

  <!-- y-axis (perspective, into page) -->
  <line x1="210" y1="330" x2="150" y2="370" stroke="#999" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="140" y="378" font-size="14" fill="#999">y</text>

  <!-- Current loop -->
  <ellipse cx="210" cy="280" rx="90" ry="28" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <text x="260" y="268" font-size="13" fill="#1565c0" font-style="italic">I</text>

  <!-- Dipole moment m arrow -->
  <line x1="210" y1="255" x2="210" y2="110" stroke="#d32f2f" stroke-width="3" marker-end="url(#arrowRed)"/>
  <text x="220" y="120" font-size="15" fill="#d32f2f" font-weight="bold">m</text>

  <!-- Field point P -->
  <circle cx="310" cy="175" r="4" fill="#333"/>
  <text x="316" y="170" font-size="14" fill="#333" font-weight="bold">P(x,y,z)</text>

  <!-- Position vector r -->
  <line x1="210" y1="280" x2="310" y2="175" stroke="#e65100" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="255" y="240" font-size="13" fill="#e65100" font-style="italic">r</text>

  <!-- B vector at P -->
  <line x1="310" y1="175" x2="350" y2="130" stroke="#e65100" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="352" y="128" font-size="14" fill="#e65100" font-weight="bold">B</text>

  <!-- B components (dashed projection lines) -->
  <!-- B_z component -->
  <line x1="310" y1="175" x2="310" y2="225" stroke="#e65100" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="315" y="222" font-size="11" fill="#e65100" font-style="italic">B<sub>z</sub></text>

  <!-- B_⊥ (radial) component in xy-plane -->
  <line x1="310" y1="175" x2="355" y2="175" stroke="#e65100" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="357" y="179" font-size="11" fill="#e65100" font-style="italic">B<sub>x</sub></text>

  <!-- Field lines -->
  <!-- Right side field line -->
  <path d="M 210 80 Q 350 100 370 200 Q 380 290 310 278" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <!-- Left side field line -->
  <path d="M 210 80 Q 70 100 50 200 Q 40 290 110 278" fill="none" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- B_r, B_θ annotation -->
  <text x="340" y="152" font-size="11" fill="#e65100" font-style="italic">B<sub>r</sub></text>
  <path d="M 315 145 Q 325 138 335 142" fill="none" stroke="#e65100" stroke-width="0.8"/>
  <text x="326" y="163" font-size="10" fill="#e65100">B<sub>θ</sub></text>

  <!-- Angle θ -->
  <path d="M 230 260 A 25 25 0 0 1 250 240" fill="none" stroke="#666" stroke-width="1"/>
  <text x="240" y="254" font-size="11" fill="#666">θ</text>

  <!-- Title -->
  <text x="210" y="408" font-size="12" fill="#666" text-anchor="middle">电流环产生的磁偶极子场</text>
</svg>
